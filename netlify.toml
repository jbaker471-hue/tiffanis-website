[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Sync Google Drive designs into Supabase every 10 minutes
[functions."sync-designs"]
  schedule = "*/10 * * * *"
